
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Input Forms</title>
</head>
<style>
    
body {
    background: lightblue;
    font-family: cursive;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.card {
    background: white;
    width: 400px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

    display: flex;
    flex-direction: column;
    gap: 12px;
}

img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
    height: 400px;
}

h3 {
    color: royalblue;
    text-align: center;
    margin: 5px;
}

.input-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

label {
    color: royalblue;
    font-weight: bold;
}

input {
    padding: 10px;
    border: 2px solid royalblue;
    border-radius: 7px;
    width: 100%;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    border-color: royalblue;
    box-shadow: 0 0 5px royalblue;
}

</style>
<body>

    <div class="card">

        <img src="photo/Kenatro.jpg.jpeg" alt="">

        <h3>My Profile</h3>
        <h3>Name: Carl Kentaro</h3>
        <h3>Age: 9</h3>
        <h3>Gender: Male</h3>
        <h3>What I want to be when I grow up:<br>
        Movie Scriptwriter or Actor</h3>

        <div class="input-container">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label>Date</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password">
            </div>

            <div class="form-group">
                <label>Favorite Color</label>
                <input type="color">
            </div>

        </div>

    </div>

</body>
</html>
